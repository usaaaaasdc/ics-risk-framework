name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  zeek-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zeek 9.0.0 and isolation runtime
        run: bash ics-pcap-service/ci-install-zeek.sh
      - name: Offline Python regression suite (real Zeek, no skipped engine tests)
        working-directory: ics-pcap-service
        run: |
          python3 -m py_compile test_engine.py
          python3 -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Linting
        run: npm run lint
        
      - name: Type Check
        run: npm run type-check
        
      - name: Run Unit Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run E2E Tests
        run: npm run test:e2e
